<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Services: HVAC Software, CRM Management, Scheduling and Dispatch, Customer Messaging">
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- card 1 -->
    <g transform="translate(0 0)">
      <rect width="282" height="300" rx="22" fill="#0F2A4A"/>
      <g transform="translate(36 40)" fill="none" stroke="#5EEAD4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <rect width="64" height="76" rx="8"/><path d="M16 24h32M16 40h32M16 56h18"/>
      </g>
      <text x="36" y="168" font-size="21" font-weight="700" fill="#fff">HVAC Software</text>
      <text x="36" y="202" font-size="16" fill="#CBD5E1">End-to-end platform for</text>
      <text x="36" y="224" font-size="16" fill="#CBD5E1">quotes, jobs, invoices</text>
      <text x="36" y="246" font-size="16" fill="#CBD5E1">and maintenance plans.</text>
    </g>
    <!-- card 2 -->
    <g transform="translate(306 0)">
      <rect width="282" height="300" rx="22" fill="#115E75"/>
      <g transform="translate(36 40)" fill="none" stroke="#FDE68A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <rect width="76" height="72" rx="8"/><path d="M0 22h76M20 0v12M56 0v12M18 42h12M44 42h12M18 58h12"/>
      </g>
      <text x="36" y="168" font-size="21" font-weight="700" fill="#fff">CRM Management</text>
      <text x="36" y="202" font-size="16" fill="#E2E8F0">Setup, cleanup and</text>
      <text x="36" y="224" font-size="16" fill="#E2E8F0">ongoing management of</text>
      <text x="36" y="246" font-size="16" fill="#E2E8F0">your customer pipeline.</text>
    </g>
    <!-- card 3 -->
    <g transform="translate(612 0)">
      <rect width="282" height="300" rx="22" fill="#0F766E"/>
      <g transform="translate(36 44)" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="16" r="14"/><circle cx="62" cy="16" r="14"/><path d="M0 70c0-16 8-26 18-26s18 10 18 26M44 70c0-16 8-26 18-26s18 10 18 26"/>
      </g>
      <text x="36" y="168" font-size="21" font-weight="700" fill="#fff">Scheduling &amp; Dispatch</text>
      <text x="36" y="202" font-size="16" fill="#CCFBF1">Book appointments and</text>
      <text x="36" y="224" font-size="16" fill="#CCFBF1">route technicians to the</text>
      <text x="36" y="246" font-size="16" fill="#CCFBF1">right job, on time.</text>
    </g>
    <!-- card 4 -->
    <g transform="translate(918 0)">
      <rect width="282" height="300" rx="22" fill="#F59E0B"/>
      <g transform="translate(36 40)" fill="none" stroke="#0F2A4A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 6h68a6 6 0 0 1 6 6v40a6 6 0 0 1-6 6H30L12 74V58H6a6 6 0 0 1-6-6V12a6 6 0 0 1 6-6z"/><path d="M20 26h40M20 40h26"/>
      </g>
      <text x="36" y="168" font-size="21" font-weight="700" fill="#0F2A4A">Customer Messaging</text>
      <text x="36" y="202" font-size="16" fill="#1E293B">Reminders, on-the-way</text>
      <text x="36" y="224" font-size="16" fill="#1E293B">alerts and follow-ups</text>
      <text x="36" y="246" font-size="16" fill="#1E293B">by email and opt-in SMS.</text>
    </g>
