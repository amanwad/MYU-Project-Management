<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="MYU Project Management LLC — Plan. Deliver. Repeat.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F38"/>
      <stop offset="0.6" stop-color="#0F2A4A"/>
      <stop offset="1" stop-color="#0E4D5C"/>
    </linearGradient>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <circle cx="1180" cy="-40" r="220" fill="#14B8A6" opacity="0.10"/>
  <circle cx="80" cy="460" r="180" fill="#F59E0B" opacity="0.08"/>

  <!-- logo mark -->
  <g transform="translate(80 92)">
    <rect width="76" height="76" rx="18" fill="url(#lg)"/>
    <rect x="14" y="20" width="28" height="7" rx="3.5" fill="#fff"/>
    <rect x="23" y="34" width="34" height="7" rx="3.5" fill="#fff" opacity="0.85"/>
    <rect x="34" y="48" width="28" height="7" rx="3.5" fill="#F59E0B"/>
  </g>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="80" y="232" font-size="58" font-weight="700" letter-spacing="-1">MYU Project Management</text>
    <text x="82" y="272" font-size="22" fill="#99F6E4" letter-spacing="4" font-weight="600">LIMITED LIABILITY COMPANY</text>
    <text x="82" y="330" font-size="26" fill="#CBD5E1">HVAC business software &amp; CRM management, end to end.</text>
  </g>

  <!-- gantt illustration -->
  <g transform="translate(880 90)">
    <rect width="320" height="240" rx="18" fill="#ffffff" opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
    <g fill="#ffffff" opacity="0.25">
      <rect x="24" y="24" width="60" height="8" rx="4"/>
      <rect x="24" y="64" width="40" height="6" rx="3"/>
      <rect x="24" y="104" width="48" height="6" rx="3"/>
      <rect x="24" y="144" width="36" height="6" rx="3"/>
      <rect x="24" y="184" width="44" height="6" rx="3"/>
    </g>
    <line x1="96" y1="50" x2="96" y2="214" stroke="#ffffff" stroke-opacity="0.15"/>
    <rect x="104" y="58" width="96" height="18" rx="9" fill="#14B8A6"/>
    <rect x="160" y="98" width="110" height="18" rx="9" fill="#2DD4BF" opacity="0.85"/>
    <rect x="200" y="138" width="80" height="18" rx="9" fill="#F59E0B"/>
    <rect x="240" y="178" width="56" height="18" rx="9" fill="#ffffff" opacity="0.5"/>
    <path d="M200 67 C215 67 215 107 160 107" stroke="#ffffff" stroke-opacity="0.4" fill="none" stroke-dasharray="4 4"/>
    <circle cx="296" cy="30" r="12" fill="#F59E0B"/>
    <path d="M290 30l4 4 7-8" stroke="#0F2A4A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
